<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>药材中部剖切图源</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block;width:1280px;height:940px}</style>
<canvas id="scene"></canvas>
<script type="module">
import * as THREE from '../../../scripts/vendor/three/three.module.js';
const data=await fetch('./cutaway_data.json').then(r=>r.json());
const canvas=document.querySelector('canvas');
const W=1280,H=940;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(2);renderer.setSize(W,H,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;
renderer.setClearColor('#ffffff',1);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-2.55*W/H,2.55*W/H,2.55,-2.55,.1,100);
camera.up.set(0,0,1);camera.position.set(7,8,6.2);camera.lookAt(0,0,1.40);
scene.add(new THREE.HemisphereLight(0xffffff,0xc5ccd4,2.0));
const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(-3,5,8);scene.add(light);
const height=2.65, radius=1;
const basic=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide});
const shell=new THREE.MeshStandardMaterial({color:'#dce3e6',roughness:1,metalness:0,side:THREE.DoubleSide});
const edgeMat=new THREE.MeshBasicMaterial({color:'#728592'});

function valueAt(r){
 const x=data.fields.xi,y=data.fields.C;
 let lo=0,hi=x.length-1;
 while(hi-lo>1){const m=(lo+hi)>>1;if(x[m]<=r)lo=m;else hi=m;}
 const a=(r-x[lo])/(x[hi]-x[lo]);return y[lo]*(1-a)+y[hi]*a;
}
function fieldColor(r){
 const t=Math.min(1,Math.max(0,valueAt(r)/2.55))*4;
 const i=Math.min(3,Math.floor(t)),a=t-i;
 const aa=data.colors[i].slice(1),bb=data.colors[i+1].slice(1);
 const rgb=[0,2,4].map(k=>((1-a)*parseInt(aa.slice(k,k+2),16)+a*parseInt(bb.slice(k,k+2),16))/255);
 return new THREE.Color().setRGB(...rgb,THREE.SRGBColorSpace).toArray();
}
function mesh(quads,material){
 const pos=[],col=[];
 for(const q of quads) for(const idx of [0,1,2,0,2,3]){
   const p=q[idx];pos.push(...p);col.push(...fieldColor(Math.min(1,Math.hypot(p[0],p[1]))));
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
 const m=new THREE.Mesh(g,material);scene.add(m);return m;
}
function at(r,t,z){return [r*Math.cos(t),r*Math.sin(t),z]}
const angular=180,radial=128,start=Math.PI/2,end=2*Math.PI;
const top=[],outer=[],wall=[];
for(let i=0;i<radial;i++)for(let j=0;j<angular;j++){
 const a=i/radial,b=(i+1)/radial,u=start+(end-start)*j/angular,v=start+(end-start)*(j+1)/angular;
 top.push([at(a,u,height),at(b,u,height),at(b,v,height),at(a,v,height)]);
}
for(let j=0;j<angular;j++){
 const u=start+(end-start)*j/angular,v=start+(end-start)*(j+1)/angular;
 outer.push([at(1,u,0),at(1,v,0),at(1,v,height),at(1,u,height)]);
}
for(const angle of [start,end])for(let i=0;i<radial;i++){
 const a=i/radial,b=(i+1)/radial;
 wall.push([at(a,angle,0),at(b,angle,0),at(b,angle,height),at(a,angle,height)]);
}
mesh(outer,shell);mesh(top,basic);mesh(wall,basic);

function tube(points,r=.006,material=edgeMat){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 const g=new THREE.TubeGeometry(curve,Math.max(2,points.length*2),r,8,false);
 const m=new THREE.Mesh(g,material);scene.add(m);return m;
}
for(const z of [0,height]){
 const arc=Array.from({length:101},(_,j)=>at(1,start+(end-start)*j/100,z));tube(arc);
 for(const angle of [start,end])tube([[0,0,z],at(1,angle,z)]);
}
for(const angle of [start,end])tube([at(1,angle,0),at(1,angle,height)]);
tube([[0,0,0],[0,0,height]],.007);

// True 3D arrows enter/leave the retained curved side, never an axial end.
function arrow(angle,z,inward,color,radialEnd=2.0){
 const r0=inward?radialEnd:1.02,r1=inward?1.02:radialEnd;
 const a=new THREE.Vector3(...at(r0,angle,z)),b=new THREE.Vector3(...at(r1,angle,z));
 const dir=b.clone().sub(a).normalize(), head=.22;
 const tipBase=b.clone().addScaledVector(dir,-head);
 const mat=new THREE.MeshBasicMaterial({color});
 const path=new THREE.LineCurve3(a,tipBase);
 scene.add(new THREE.Mesh(new THREE.TubeGeometry(path,1,.027,12,false),mat));
 const cone=new THREE.Mesh(new THREE.ConeGeometry(.105,head,28),mat);
 cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
 cone.position.copy(b).addScaledVector(dir,-head/2);scene.add(cone);
}
arrow(105*Math.PI/180,2.00,true,'#db705e',2.03);
arrow(344*Math.PI/180,.65,true,'#db705e',1.91);
arrow(106*Math.PI/180,.69,false,'#2386ad',2.09);
arrow(343*Math.PI/180,1.92,false,'#2386ad',2.02);

renderer.render(scene,camera);
window.__CUTAWAY__={renderer,scene,camera,data,THREE};
window.__READY__=true;
</script>
</html>
